name: Build, test, image and release

# filehub 唯一构建/发布工作流：
# - workflow_dispatch：人工触发，默认只编译/测试/打包；显式 publish=true 时受控发布；
# - push v* 标签：编译 + 测试 + 生成并发布（GHCR 镜像 + GitHub Release）。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GHCR image and GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MUSL_TARGET: x86_64-unknown-linux-musl

jobs:
  version:
    name: Resolve version and publish gate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      publish_requested: ${{ steps.resolve.outputs.publish_requested }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain for dependency resolution
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Update Rust dependencies and resolve version gates
        id: resolve
        env:
          CANONICAL_REPOSITORY: ${{ vars.CANONICAL_REPOSITORY }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          cargo update
          test -s Cargo.lock

          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import re
          import sys

          packages = [item for item in json.load(sys.stdin)["packages"] if item["name"] == "filehub-server"]
          if len(packages) != 1:
              raise SystemExit("expected exactly one filehub-server package in cargo metadata")
          version = packages[0]["version"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit(f"unsupported workspace version: {version}")
          print(version)
          ')"

          validate_release_tag() {
            if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag ${release_tag} must match vMAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            if [[ "${release_tag}" != "v${version}" ]]; then
              echo "Release tag ${release_tag} does not match workspace version ${version}." >&2
              exit 1
            fi
          }

          source_sha="${GITHUB_SHA}"
          publish_requested=false
          release_tag=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            validate_release_tag
            expected="${CANONICAL_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/sfo-filehub}"
            if [[ "${GITHUB_REPOSITORY}" != "${expected}" ]]; then
              echo "Repository ${GITHUB_REPOSITORY} is not the canonical release repository ${expected}; build only." >&2
            else
              publish_requested=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_PUBLISH}" == "true" ]]; then
            release_tag="${DISPATCH_RELEASE_TAG}"
            if [[ -z "${release_tag}" ]]; then
              echo "release_tag is required when publish=true." >&2
              exit 1
            fi
            validate_release_tag
            expected="${CANONICAL_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/sfo-filehub}"
            if [[ "${GITHUB_REPOSITORY}" != "${expected}" ]]; then
              echo "Manual publication is allowed only in ${expected}; got ${GITHUB_REPOSITORY}." >&2
              exit 1
            fi
            publish_requested=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_RELEASE_TAG}" ]]; then
            echo "release_tag is ignored because publish=false."
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "publish_requested=${publish_requested}" >> "${GITHUB_OUTPUT}"

      - name: Store updated Cargo.lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 14

  build:
    name: Rust build (${{ matrix.artifact }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
            binary: filehub
            server: true
          - os: macos-14
            artifact: macos-aarch64
            binary: filehub
          - os: windows-2022
            artifact: windows-x86_64
            binary: filehub.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Download updated Cargo.lock
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-lock
          path: .ci-cargo-lock

      - name: Install updated Cargo.lock
        run: |
          set -euo pipefail
          test -s .ci-cargo-lock/Cargo.lock
          cp .ci-cargo-lock/Cargo.lock Cargo.lock
          test -s Cargo.lock

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install musl toolchain
        if: ${{ matrix.server }}
        run: |
          rustup target add ${MUSL_TARGET}
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test Rust workspace
        if: ${{ matrix.server }}
        run: cargo test --workspace --all-targets --locked

      - name: Build filehub-server (release)
        if: ${{ matrix.server }}
        run: cargo build --release -p filehub-server --target ${MUSL_TARGET} --locked

      - name: Build filehub-cli (release)
        run: cargo build --release -p filehub-cli --locked

      - name: Store server binary
        if: ${{ matrix.server }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: filehub-server
          path: target/${{ env.MUSL_TARGET }}/release/filehub-server
          if-no-files-found: error
          retention-days: 14

      - name: Package CLI archive
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/filehub-cli_${VERSION}_${ARTIFACT}.tar.gz" -C target/release "${BINARY}"
          test -s "dist/filehub-cli_${VERSION}_${ARTIFACT}.tar.gz"

      - name: Store CLI archive
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: filehub-cli-${{ matrix.artifact }}
          path: dist/filehub-cli_${{ needs.version.outputs.version }}_${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  test-web:
    name: admin-web tests and build
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build and verify dist
        run: npm run test:dv

      - name: Store admin-web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: admin-web/dist
          if-no-files-found: error
          retention-days: 14

  authorize-publication:
    name: Authorize publication
    needs: [version, build, test-web]
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.authorize.outputs.publish }}
      release_tag: ${{ steps.authorize.outputs.release_tag }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 1

      - name: Resolve and authorize release tag
        id: authorize
        env:
          PUBLISH_REQUESTED: ${{ needs.version.outputs.publish_requested }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
        run: |
          set -euo pipefail

          publish=false
          release_tag=""
          if [[ "${PUBLISH_REQUESTED}" == "true" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: ${RELEASE_TAG}" >&2
              exit 1
            fi
            git fetch --force --no-tags origin \
              "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            checkout_sha="$(git rev-parse 'HEAD^{commit}')"
            tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "${checkout_sha}" != "${SOURCE_SHA}" || "${tag_sha}" != "${SOURCE_SHA}" ]]; then
              echo "Release tag ${RELEASE_TAG} (${tag_sha}) does not match built source ${SOURCE_SHA}." >&2
              exit 1
            fi
            publish=true
            release_tag="${RELEASE_TAG}"
          fi

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build-image:
    name: Build and publish Docker image
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: [version, build, test-web, authorize-publication]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: filehub-server
          path: ctx/server

      - name: Download admin-web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: ctx/web

      - name: Assemble minimal image context
        run: |
          set -euo pipefail
          mkdir -p ctx/server ctx/web
          chmod +x ctx/server/filehub-server
          test -x ctx/server/filehub-server
          test -f ctx/web/index.html
          cp docker/Dockerfile docker/nginx.conf docker/entrypoint.sh ctx/

      - name: Build Docker image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/filehub:v${VERSION}"
          docker build --tag "$image" ctx
          docker image inspect "$image" >/dev/null

      - name: Smoke test container startup
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/filehub:v${VERSION}"
          config="${GITHUB_WORKSPACE}/docker/filehub-server.example.yaml"
          test -s "$config"
          config_hash_before="$(sha256sum "$config" | cut -d ' ' -f 1)"
          cid="filehub-smoke-$$"
          docker run -d --rm --name "$cid" \
            --mount "type=bind,src=${config},dst=/etc/filehub/filehub-server.yaml,readonly" \
            "$image"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 45); do
            if docker exec "$cid" sh -c 'grep -q "^filehub-server$" /proc/[0-9]*/comm 2>/dev/null' \
               && docker exec "$cid" wget -q -O /dev/null http://127.0.0.1/healthz; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "container smoke test failed: filehub-server not running or /healthz unreachable" >&2
            docker logs --tail 50 "$cid" >&2 || true
            exit 1
          fi
          config_hash_after="$(sha256sum "$config" | cut -d ' ' -f 1)"
          test "$config_hash_after" = "$config_hash_before"
          if docker run --rm "$image"; then
            echo "container without mounted config unexpectedly started" >&2
            exit 1
          fi
          echo "container smoke test passed (filehub-server running, /healthz ok)"

      - name: Publish image to GHCR
        if: ${{ needs.authorize-publication.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.authorize-publication.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${tag_sha}" != "${SOURCE_SHA}" ]]; then
            echo "Release tag ${RELEASE_TAG} moved to ${tag_sha}; expected ${SOURCE_SHA}." >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version_image="ghcr.io/${owner}/filehub:v${VERSION}"
          latest_image="ghcr.io/${owner}/filehub:latest"
          docker tag "$version_image" "$latest_image"
          echo "$GH_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "$version_image"
          docker push "$latest_image"
          version_digest="$(docker buildx imagetools inspect "$version_image" --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "$latest_image" --format '{{.Manifest.Digest}}')"
          test -n "$version_digest"
          test "$latest_digest" = "$version_digest"

  release:
    name: Publish GitHub Release
    if: ${{ needs.authorize-publication.outputs.publish == 'true' }}
    needs: [version, build, test-web, authorize-publication, build-image]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify release tag still points at built source
        env:
          RELEASE_TAG: ${{ needs.authorize-publication.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${tag_sha}" != "${SOURCE_SHA}" ]]; then
            echo "Release tag ${RELEASE_TAG} moved to ${tag_sha}; expected ${SOURCE_SHA}." >&2
            exit 1
          fi

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: filehub-server
          path: dist/raw/server

      - name: Download admin-web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: dist/raw/web

      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: filehub-cli-*
          path: dist/raw/cli
          merge-multiple: true

      - name: Package server and admin-web release archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/server dist/web
          cp dist/raw/server/filehub-server dist/server/filehub-server
          cp -R dist/raw/web/. dist/web/
          chmod +x dist/server/filehub-server
          tar -czf "dist/filehub-server_${VERSION}_linux_x86_64.tar.gz" -C dist server web
          test -s "dist/filehub-server_${VERSION}_linux_x86_64.tar.gz"

      - name: Verify release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cp dist/raw/cli/*.tar.gz dist/
          expected=(
            "dist/filehub-server_${VERSION}_linux_x86_64.tar.gz"
            "dist/filehub-cli_${VERSION}_linux-x86_64.tar.gz"
            "dist/filehub-cli_${VERSION}_macos-aarch64.tar.gz"
            "dist/filehub-cli_${VERSION}_windows-x86_64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -s "$asset"
            tar -tzf "$asset" >/dev/null
          done
          ls -l dist/*.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.authorize-publication.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz)
          if [[ ${#assets[@]} -ne 4 ]]; then
            echo "Expected exactly four release archives, found ${#assets[@]}." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            printf -v notes 'filehub %s\n\nDocker image: ghcr.io/%s/filehub:v%s\n\nRelease assets:\n- filehub-server_%s_linux-x86_64.tar.gz\n- filehub-cli_%s_linux-x86_64.tar.gz\n- filehub-cli_%s_macos-aarch64.tar.gz\n- filehub-cli_%s_windows-x86_64.tar.gz' \
              "$VERSION" "$owner" "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION"
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "filehub ${VERSION}" \
              --notes "$notes"
          fi
