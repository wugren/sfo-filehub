schema_version: 1
# filehub-server 上传鉴权前置与流式收流测试计划（026-upload-authz-body-bounds）
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: migration-required
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["server/src", "server/Cargo.toml", "Cargo.lock", "server/config.example.json", "server/tests", "docs/api/v1-contract.md", "docs/versions/v0.1/modules/filehub/001-filehub-core-platform/design"]
contract_checks:
  mode: enabled
  steps:
    - id: contract-repository-compile-closure
      name: workspace Rust consumers compile with sfo-http 0.8 and sfo-account shim
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      change_ids: ["fh-upload-authz-gate", "fh-http-body-limit", "fh-upload-size-and-decompression-bounds", "fh-upload-security-tests"]
      run: ["cargo", "test", "--workspace", "--no-run", "--all-targets"]
    - id: contract-public-api-positive
      name: UploadStream/MultipartParser new interfaces compile for consumers
      kind: external-positive
      assertion: new-path-compiles
      change_ids: ["fh-upload-authz-gate", "fh-http-body-limit", "fh-upload-size-and-decompression-bounds", "fh-upload-security-tests"]
      run: ["cargo", "check", "--manifest-path", "server/Cargo.toml", "--lib", "--bins", "--tests"]
    - id: contract-documentation-examples
      name: crate documentation examples compile
      kind: documentation-examples
      assertion: documentation-examples-compile
      change_ids: ["fh-upload-authz-gate", "fh-http-body-limit", "fh-upload-size-and-decompression-bounds", "fh-upload-security-tests"]
      run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--doc"]
    - id: contract-removed-symbol-scan
      name: no unallowlisted removed upload symbol references
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      change_ids: ["fh-upload-authz-gate", "fh-http-body-limit", "fh-upload-size-and-decompression-bounds", "fh-upload-security-tests"]
      run: ["python3", "harness/scripts/consumer-closure-check.py", "--version", "v0.1", "--module", "filehub", "--task-name", "026-upload-authz-body-bounds"]
defaults:
  workdir: .
  timeout_sec: 900
  env:
    CARGO_HOME: .harness/cargo-home
    CARGO_TARGET_DIR: .harness/cargo-target
levels:
  unit:
    mode: enabled
    summary: 单元测试：multipart 增量解析、流式 ingest、限量解压、上传路径迁移
    test_targets:
      - server/tests/unit
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: upload-unit
        name: run filehub-server unit tests
        change_ids: ["fh-upload-authz-gate", "fh-http-body-limit", "fh-upload-size-and-decompression-bounds", "fh-upload-security-tests"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "unit_tests"]
  dv:
    mode: enabled
    summary: DV：上传/发布/下载主流程与配置变体回归
    test_targets:
      - server/tests/dv_tests.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: upload-dv
        name: run filehub-server DV tests
        change_ids: ["fh-upload-authz-gate", "fh-http-body-limit", "fh-upload-size-and-decompression-bounds", "fh-upload-security-tests"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "dv_tests"]
  integration:
    mode: enabled
    summary: 集成：匿名 401 前置、超限 422、压缩炸弹、合法上传/发布/下载回归
    test_targets:
      - server/tests/api_integration.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: upload-integration
        name: run filehub-server API integration tests
        change_ids: ["fh-upload-authz-gate", "fh-http-body-limit", "fh-upload-size-and-decompression-bounds", "fh-upload-security-tests"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "api_integration"]
