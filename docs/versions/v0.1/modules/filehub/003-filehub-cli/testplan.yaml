schema_version: 1
# filehub-cli 任务测试计划（003-filehub-cli，fh-cli-login/publish/download/versions）
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: none
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: false
evidence_inputs: ["cli/src", "cli/tests", "docs/api/v1-contract.md"]
contract_checks:
  mode: disabled
  reason: greenfield 新 crate，无 breaking/migration-required API、无 crate-root export 或构建面变更、无文档示例影响；对外为新增 CLI 命令面与 v1 消费契约而非既有接口变更
  steps: []
defaults:
  workdir: .
  timeout_sec: 1200
  env:
    CARGO_HOME: .harness/cargo-home
    CARGO_TARGET_DIR: .harness/cargo-target
levels:
  unit:
    mode: enabled
    summary: 单元测试：credential_store/archive/cli 参数域
    test_targets:
      - cli/src/credential_store
      - cli/src/archive
      - cli/src/cli
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: unit-cargo-lib
        name: run filehub-cli library unit tests
        change_ids: ["fh-cli-login", "fh-cli-publish", "fh-cli-download", "fh-cli-versions"]
        run: ["env", "CARGO_HOME=.harness/cargo-home", "CARGO_TARGET_DIR=.harness/cargo-target", "cargo", "test", "--manifest-path", "cli/Cargo.toml", "--lib"]

  dv:
    mode: enabled
    summary: DV：主/失败工作流、配置持久化、安全打包反例
    test_targets:
      - cli/tests/dv_tests.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: dv-cargo-test
        name: run filehub-cli DV tests
        change_ids: ["fh-cli-login", "fh-cli-publish", "fh-cli-download", "fh-cli-versions"]
        run: ["env", "CARGO_HOME=.harness/cargo-home", "CARGO_TARGET_DIR=.harness/cargo-target", "cargo", "test", "--manifest-path", "cli/Cargo.toml", "--test", "dv_tests"]

  integration:
    mode: enabled
    summary: 集成：mock v1 契约正反例与 401 续期
    test_targets:
      - cli/tests/api_integration.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: integration-cargo
        name: run filehub-cli API integration tests
        change_ids: ["fh-cli-login", "fh-cli-publish", "fh-cli-download", "fh-cli-versions"]
        run: ["env", "CARGO_HOME=.harness/cargo-home", "CARGO_TARGET_DIR=.harness/cargo-target", "cargo", "test", "--manifest-path", "cli/Cargo.toml", "--test", "api_integration"]
