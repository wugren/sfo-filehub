schema_version: 1
# filehub-server 任务测试计划（001-filehub-core-platform，I-001~I-008）
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: none
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: false
evidence_inputs: ["server/src", "server/migrations", "server/tests", "docs/api/v1-contract.md"]
contract_checks:
  mode: disabled
  reason: 新 crate/greenfield，无 breaking/migration-required API、无 crate-root export 或构建面变更、无文档示例影响；对外为新增 v1 契约而非既有接口变更
  steps: []
defaults:
  workdir: .
  timeout_sec: 900
  env:
    CARGO_HOME: .harness/cargo-home
    CARGO_TARGET_DIR: .harness/cargo-target
levels:
  unit:
    mode: enabled
    summary: 单元测试：model/account/permissions/tokens/storage/versions/projects
    test_targets:
      - server/tests/unit
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: unit-all
        name: run filehub-server unit tests
        change_ids: ["fh-server-account", "fh-server-permissions", "fh-server-tokens", "fh-server-files", "fh-server-versions", "fh-server-projects", "fh-server-http"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "unit_tests"]

  dv:
    mode: enabled
    summary: DV：整模块生命周期、主/失败工作流、配置变体与持久化
    test_targets:
      - server/tests/dv_tests.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: dv-all
        name: run filehub-server DV tests
        change_ids: ["fh-server-account", "fh-server-permissions", "fh-server-tokens", "fh-server-files", "fh-server-versions", "fh-server-projects", "fh-server-http"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "dv_tests"]

  integration:
    mode: enabled
    summary: 集成：真实 sfo-http/Actix HTTP 契约与跨模块数据流
    test_targets:
      - server/tests/api_integration.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: integration-api
        name: run filehub-server HTTP integration tests
        change_ids: ["fh-server-account", "fh-server-permissions", "fh-server-tokens", "fh-server-files", "fh-server-versions", "fh-server-projects", "fh-server-http"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "api_integration"]
