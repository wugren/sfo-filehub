schema_version: 1
# filehub-server token 权限服务端化测试计划（025-token-project-scope-enforcement）
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: none
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: false
evidence_inputs: ["server/src", "server/tests/unit", "docs/api/v1-contract.md"]
contract_checks:
  mode: enabled
  steps:
    - id: contract-external-positive
      name: new Principal::Token/TokenPrincipal shapes compile for consumers
      kind: external-positive
      assertion: new-path-compiles
      change_ids: ["fh-token-permissions-server-side", "fh-token-project-scope-enforce", "fh-token-project-scope-tests"]
      run: ["cargo", "check", "--manifest-path", "server/Cargo.toml", "--lib", "--bins", "--tests"]
    - id: contract-external-negative
      name: old Principal::Token shape rejected by compiler
      kind: external-negative
      assertion: old-path-rejected-for-removed-symbol
      change_ids: ["fh-token-permissions-server-side", "fh-token-project-scope-enforce", "fh-token-project-scope-tests"]
      run: ["bash", "docs/versions/v0.1/modules/filehub/025-token-project-scope-enforcement/testing/negative-old-token-principal.sh"]
    - id: contract-removed-symbol-scan
      name: no unallowlisted removed token permission symbol references
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      change_ids: ["fh-token-permissions-server-side", "fh-token-project-scope-enforce", "fh-token-project-scope-tests"]
      run: ["python3", "harness/scripts/consumer-closure-check.py", "--version", "v0.1", "--module", "filehub", "--task-name", "025-token-project-scope-enforcement"]
    - id: contract-repository-compile-closure
      name: workspace Rust consumers compile
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      change_ids: ["fh-token-permissions-server-side", "fh-token-project-scope-enforce", "fh-token-project-scope-tests"]
      run: ["cargo", "test", "--workspace", "--no-run", "--all-targets"]
defaults:
  workdir: .
  timeout_sec: 900
  env:
    CARGO_HOME: .harness/cargo-home
    CARGO_TARGET_DIR: .harness/cargo-target
levels:
  unit:
    mode: enabled
    summary: 单元测试：token 权限数据库权威 + project_scope 授权矩阵
    test_targets:
      - server/tests/unit
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: token-permissions-unit
        name: run filehub-server unit tests
        change_ids: ["fh-token-permissions-server-side", "fh-token-project-scope-enforce", "fh-token-project-scope-tests"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "unit_tests"]
  dv:
    mode: enabled
    summary: DV：token 生命周期与持久化回归
    test_targets:
      - server/tests/dv_tests.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: token-permissions-dv
        name: run filehub-server DV tests
        change_ids: ["fh-token-permissions-server-side", "fh-token-project-scope-enforce", "fh-token-project-scope-tests"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "dv_tests"]
  integration:
    mode: enabled
    summary: 集成：HTTP token/项目/版本访问边界回归
    test_targets:
      - server/tests/api_integration.rs
    preconditions:
      tools: ["cargo"]
      env: []
      services: []
      notes: []
    steps:
      - id: token-permissions-integration
        name: run filehub-server API integration tests
        change_ids: ["fh-token-permissions-server-side", "fh-token-project-scope-enforce", "fh-token-project-scope-tests"]
        run: ["cargo", "test", "--manifest-path", "server/Cargo.toml", "--test", "api_integration"]
