# filehub nginx 站点模板：admin-web 静态资源 + /account、/api/v1 反代。
# __SERVER_PORT__ 由 docker/entrypoint.sh 按 FH_SERVER_PORT 替换后写入 conf.d。
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传/下载请求体不设 nginx 上限，由 filehub-server 的 FH_MAX_ARCHIVE_BYTES 约束。
    client_max_body_size 0;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # sfo-account 登录/会话/续期路由，原样转发，不重写 URI。
    location ^~ /account/ {
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # filehub v1 API（含上传/下载），原样转发，不重写 URI。
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退到 index.html；静态资源命中则直接下发。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
