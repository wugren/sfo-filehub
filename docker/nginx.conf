# filehub nginx 站点模板：admin-web 静态资源 + /account、/api/v1 反代。
# __SERVER_PORT__ 由 docker/entrypoint.sh 按 FH_SERVER_PORT 替换后写入 conf.d。
# 登录限流 zone：按真实客户端 IP（$binary_remote_addr）计数，仅作用于登录路由。
limit_req_zone $binary_remote_addr zone=fh_login:10m rate=5r/s;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传/下载请求体不设 nginx 上限，由 filehub-server 的 FH_MAX_ARCHIVE_BYTES 约束。
    client_max_body_size 0;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 匿名登录体上限 64 KiB：在代理缓冲前拒绝超限请求，避免 nginx 临时存储耗尽。
    location = /account/login {
        client_max_body_size 64k;
        # 登录限流：平均 5r/s、突发 20 个请求，超限返回 429。
        # 与应用层固定窗口限流（默认 30 次/分钟/IP）构成双层防护。
        limit_req zone=fh_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 匿名 session 信息接口体上限 64 KiB：与登录一致，在代理缓冲前拒绝超限请求。
    location = /account/get_account_info_of_session {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # sfo-account 登录/会话/续期路由，原样转发，不重写 URI。
    location ^~ /account/ {
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # filehub v1 API（含上传/下载），原样转发，不重写 URI。
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退到 index.html；静态资源命中则直接下发。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
