# Docker 镜像专用配置示例。
# 复制后必须替换示例私钥和管理员密码，再以只读方式挂载到：
# /etc/filehub/filehub-server.yaml
server:
  # nginx 固定反代到 127.0.0.1:8080，这两个值不得修改。
  server_addr: "127.0.0.1"
  port: 8080

  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  expose_headers: []
  max_age: 3600
  support_credentials: false
  login_rate_limit_per_minute: 30
  login_rate_limit_window_secs: 60

users:
  # 仅为示例 Ed25519 PKCS#8 PEM 私钥，生产部署必须替换。
  # 生成命令：openssl genpkey -algorithm Ed25519
  session_private_key: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEIJGVLyTXHTLSMPclke6+1xCFTfX+TmVRcs6UNiMW35Ok
    -----END PRIVATE KEY-----

  users:
    - username: "admin"
      # 生产部署必须替换；也可改用 password_hash。
      password: "replace-with-a-strong-password"
      # password_hash: "$2b$12$replace-with-a-complete-bcrypt-hash"

files:
  data_dir: "/data/files"
  max_archive_bytes: 104857600

db_path: "/data/filehub.db"
